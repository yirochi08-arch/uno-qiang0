<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>一起玩牌</title>
<script>
  // old UNO invite links were …/uno-qiang0/#CODE: send them on to the UNO page
  const toUno = () => { if (/^#[a-z0-9]{4}$/i.test(location.hash)) location.replace('uno.html' + location.hash); };
  toUno(); addEventListener('hashchange', toUno);
</script>
<style>
/*@FONT_FACES@*/
/* Layout: a short heading, then one card per game, stacked on phones and side by side on wide screens */
:root{
  color-scheme: dark;
  --felt:#221c2c;
  --felt-hi:#352b42;
  --panel:#18121f;
  --ink:#f5f0f7;
  --muted:#b5a8c2;
  --line:rgba(245,240,247,.13);
  --gold:#ffd35c;
  --red:#e0403e; --yellow:#f2b40c; --green:#26a150; --blue:#2470d4;
  --paper:#fbf8f2;
  --f-display:"Rubik","Arial Black",system-ui,sans-serif;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background-color:var(--felt);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px),radial-gradient(130% 90% at 50% 30%,var(--felt-hi) 0%,var(--felt) 64%);
  background-size:5px 5px,100% 100%;background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:980px;margin:0 auto;padding-block:36px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
header h1{margin:0;font:900 40px/1.1 var(--f-body);letter-spacing:.04em;color:var(--gold);text-shadow:2px 2px 0 #000}
header p{margin:8px 0 0;color:var(--muted);max-width:34em}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.game{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;
  transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.35);outline:none}
.art{height:96px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.art > *{margin:0 -10px;transform-origin:50% 130%}
.art > :nth-child(1){transform:rotate(-16deg)} .art > :nth-child(2){transform:rotate(-5deg) translateY(-4px)} .art > :nth-child(3){transform:rotate(6deg) translateY(-4px)} .art > :nth-child(4){transform:rotate(17deg)}
.name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name b{font:900 24px/1.1 var(--f-body)}
.name span{font-size:12px;color:var(--muted);padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.game p{margin:0;color:var(--muted);font-size:14px}
.go{margin-top:auto;align-self:flex-start;font:800 15px/1 var(--f-body);color:#2b1b05;background:var(--gold);padding:11px 18px;border-radius:999px}
footer{color:var(--muted);font-size:13px}
/* mini UNO card */
.uc{--w:50px;--cc:var(--red);position:relative;display:block;width:var(--w);aspect-ratio:2/3;border-radius:calc(var(--w)*.11);background:var(--cc);box-shadow:inset 0 0 0 calc(var(--w)*.055) var(--paper),0 6px 12px rgba(0,0,0,.35);overflow:hidden}
.uc::before{content:"";position:absolute;left:50%;top:50%;width:64%;height:94%;background:var(--paper);border-radius:50%;transform:translate(-50%,-50%) rotate(30deg)}
.uc b{position:absolute;inset:0;display:grid;place-items:center;font:900 italic calc(var(--w)*.56)/1 var(--f-display);color:var(--cc);text-shadow:calc(var(--w)*.03) calc(var(--w)*.03) 0 #1b1416}
/* mini playing card */
.pc{--w:50px;position:relative;display:block;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.1);background:var(--paper);color:#1c1a1f;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 6px 12px rgba(0,0,0,.35);overflow:hidden}
.pc.red{color:#cf3530}
.pc .r{position:absolute;left:8%;top:5%;font:800 calc(var(--w)*.32)/1 var(--f-display);letter-spacing:-.07em}
.pc .s{position:absolute;left:9%;top:38%;font-size:calc(var(--w)*.24);line-height:1}
.pc .big{position:absolute;right:8%;bottom:3%;font-size:calc(var(--w)*.58);line-height:1}
.pc .jk{position:absolute;left:9%;top:7%;writing-mode:vertical-rl;text-orientation:upright;font:800 calc(var(--w)*.15)/1 var(--f-display)}
.pc .jn{position:absolute;right:7%;bottom:6%;font:900 calc(var(--w)*.25)/1 var(--f-body)}
@media (max-width:640px){ .wrap{padding-block:24px 30px} header h1{font-size:32px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>一起玩牌</h1>
    <p>选一个玩法，和电脑玩，或者开个房间叫朋友一起。打开就能玩，不用注册登录。</p>
  </header>
  <section class="games" aria-label="玩法">
    <a class="game" href="uno.html">
      <div class="art"><span class="uc" style="--cc:var(--red)"><b>0</b></span><span class="uc" style="--cc:var(--yellow)"><b>7</b></span><span class="uc" style="--cc:var(--green)"><b>+2</b></span><span class="uc" style="--cc:var(--blue)"><b>5</b></span></div>
      <div class="name"><b>UNO 抢0</b><span>2–10 人</span></div>
      <p>经典 UNO。有人出 0，全桌抢着拍，最慢的罚摸；还能选加牌叠加或 +4 质疑。</p>
      <span class="go">进入</span>
    </a>
    <a class="game" href="poker.html?g=ddz">
      <div class="art"><span class="pc red"><span class="jk">JOKER</span><span class="jn">大王</span></span><span class="pc"><span class="jk">JOKER</span><span class="jn">小王</span></span><span class="pc"><span class="r">2</span><span class="s">♠</span><span class="big">♠</span></span><span class="pc red"><span class="r">A</span><span class="s">♥</span><span class="big">♥</span></span></div>
      <div class="name"><b>斗地主</b><span>3 人</span></div>
      <p>叫分抢地主，一个地主对两个农民。炸弹、王炸、春天都翻倍。</p>
      <span class="go">进入</span>
    </a>
    <a class="game" href="poker.html?g=pdk">
      <div class="art"><span class="pc"><span class="r">3</span><span class="s">♠</span><span class="big">♠</span></span><span class="pc red"><span class="r">7</span><span class="s">♦</span><span class="big">♦</span></span><span class="pc"><span class="r">K</span><span class="s">♣</span><span class="big">♣</span></span><span class="pc"><span class="r">2</span><span class="s">♠</span><span class="big">♠</span></span></div>
      <div class="name"><b>跑得快</b><span>3 人 · 16 张</span></div>
      <p>♠3 先出，有大必压，下家报单要顶大。谁先出完谁赢，炸弹现结。</p>
      <span class="go">进入</span>
    </a>
  </section>
  <footer>开房间后点「复制邀请」发给朋友；空位由电脑补上。</footer>
</main>
</body>
</html>
